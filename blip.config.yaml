version: 1

brand:
  name: WuBarlynn Status
  tagline: WuBarlynn services status.
  primaryColor: "#22c55e"
  website: https://wubarlynn.top

defaults:
  timeoutMs: 10000
  retries: 2
  degradedThresholdMs: 2000
  maxHistoryPoints: 2016
  sslWarnDays: 30
  domainWarnDays: [30, 15, 7]
  userAgent: "Blip/0.1 (+https://status.wubarlynn.top)"

groups:
  - id: wubarlynn
    name: WuBarlynn Services
    description: Cloudflare Workers and hosted services.

sites:
  - name: Blip Status
    url: https://blipstatus.wubarlynn.top
    group: wubarlynn
    public: true
    ssl: true
    description: Blip monitoring status page.

  - name: Discourse Monitor
    url: https://discourse-monitor.wubarlynn.top
    group: wubarlynn
    public: true
    ssl: true
    description: Discourse monitoring Worker.

  - name: WoeGotify
    url: https://woegotify.wubarlynn.top
    group: wubarlynn
    public: true
    ssl: true
    description: Woe notification service.

  - name: Bark Worker
    url: https://bark.wubarlynn.top
    group: wubarlynn
    public: true
    ssl: true
    description: Bark notification Worker.

  - name: Cloud Mail
    url: https://mail.wubarlynn.top
    group: wubarlynn
    public: true
    ssl: true
    description: Cloud Mail Worker.

access:
  publicStatusPage: true
  publicDashboard: false
  principals:
    - id: admin
      label: Admin
      role: ADMIN
      password: ${BLIP_PW_ADMIN}

channels: []
