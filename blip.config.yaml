version: 1

brand:
  name: WuBarlynn Status
  tagline: WuBarlynn services status.
  primaryColor: "#22c55e"
  website: https://wubarlynn.top

defaults:
  timeoutMs: 10000
  retries: 2
  degradedThresholdMs: 2000
  maxHistoryPoints: 2016
  sslWarnDays: 30
  domainWarnDays: [30, 15, 7]
  userAgent: "Blip/0.1 (+https://status.wubarlynn.top)"

groups:
  - id: wubarlynn
    name: WuBarlynn Services
    description: Cloudflare Workers and hosted services.
  - id: xgs
    name: XGS
    description: XGS Minecraft server.

sites:
  - name: Discourse Monitor
    url: https://discourse-monitor.wubarlynn.top
    group: wubarlynn
    public: true
    ssl: true
    description: Discourse monitoring Worker.

  - name: Gotify
    url: https://gotify.wubarlynn.top
    group: wubarlynn
    public: true
    ssl: true
    description: Woe notification service.

  - name: Bark Worker
    url: https://bark.wubarlynn.top
    group: wubarlynn
    public: true
    ssl: true
    description: Bark notification Worker.

  - name: Cloud Mail
    url: https://mail.wubarlynn.top
    group: wubarlynn
    public: true
    ssl: true
    description: Cloud Mail Worker.

  - name: XGS星光服
    url: https://mcstatus.xingguang.space/get_motd
    group: xgs
    public: true
    expectedStatus: 200
    expectJson:
      - path: status
        equals: online
    description: Minecraft MOTD status probe.

access:
  publicStatusPage: true
  publicDashboard: false
  principals:
    - id: admin
      label: Admin
      role: ADMIN
      password: ${BLIP_PW_ADMIN}

channels:
  - id: bark-12mini
    type: bark
    url: ${BARK_12MINI_URL}
    events: [down, up]

  - id: bark-macbookair
    type: bark
    url: ${BARK_MACBOOKAIR_URL}
    events: [down, up]

  - id: gotify
    type: gotify
    url: https://gotify.wubarlynn.top/message
    token: ${GOTIFY_TOKEN}
    priority: 5
    events: [down, up]

  - id: napcat-xgs
    type: napcat
    apiUrl: ${NAPCAT_API_URL}
    accessToken: ${NAPCAT_ACCESS_TOKEN}
    groupId: ${NAPCAT_GROUP_ID}
    sites: [xgs]
    events: [down, up]
